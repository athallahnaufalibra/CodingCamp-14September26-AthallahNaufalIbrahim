<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Notification bar -->
  <div id="notification-bar" role="alert" hidden>
    <span id="notification-msg"></span>
    <button id="notification-dismiss" type="button">&#215;</button>
  </div>

  <!-- Header -->
  <header>
    <span id="balance-display">0.00</span>
    <button id="toggle-summary-btn" type="button">&#128197; Monthly Summary</button>
    <button id="toggle-limits-btn" type="button">&#127919; Spending Limits</button>
  </header>

  <main>

    <!-- Input form -->
    <section id="form-section">
      <h2>Add Transaction</h2>
      <form id="txn-form" novalidate>
        <div class="field-group">
          <label for="item-name">Item Name</label>
          <input id="item-name" type="text" maxlength="100" required
                 placeholder="e.g. Grocery run" autocomplete="off" />
          <span class="error" id="item-name-error" aria-live="polite"></span>
        </div>

        <div class="field-group">
          <label for="amount">Amount</label>
          <input id="amount" type="number" min="0.01" max="999999999.99"
                 step="0.01" required placeholder="0.00"
                 inputmode="decimal" />
          <span class="error" id="amount-error" aria-live="polite"></span>
        </div>

        <div class="field-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
          <span class="error" id="category-error" aria-live="polite"></span>
        </div>

        <button id="add-btn" type="submit">Add Transaction</button>
      </form>

      <!-- Custom category -->
      <div id="custom-cat-section">
        <h3>Add Custom Category</h3>
        <input id="custom-cat-input" type="text" maxlength="50"
               placeholder="New category name" autocomplete="off" />
        <button id="add-cat-btn" type="button">Add Category</button>
        <span id="custom-cat-error" aria-live="polite"></span>
      </div>
    </section>

    <!-- Transaction list -->
    <section id="list-section">
      <h2>Transactions</h2>
      <div id="txn-list-wrapper">
        <ul id="txn-list" aria-label="Transaction list">
          <li class="empty-state">No transactions recorded.</li>
        </ul>
      </div>
    </section>

    <!-- Chart -->
    <section id="chart-section">
      <h2>Spending by Category</h2>
      <div id="chart-wrapper">
        <canvas id="spending-chart"></canvas>
        <p id="chart-placeholder">No data yet. Add a transaction to see your spending chart.</p>
      </div>
    </section>

  </main>

  <!-- Modal: Monthly Summary -->
  <div id="modal-summary" class="modal" role="dialog" aria-modal="true"
       aria-labelledby="modal-summary-title" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-summary-title">Monthly Summary</h2>
        <button class="modal-close-btn" type="button" aria-label="Close">&#215;</button>
      </div>
      <div class="modal-body">
        <div id="monthly-summary"></div>
      </div>
    </div>
  </div>

  <!-- Modal: Spending Limits -->
  <div id="modal-limits" class="modal" role="dialog" aria-modal="true"
       aria-labelledby="modal-limits-title" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-limits-title">Spending Limits</h2>
        <button class="modal-close-btn" type="button" aria-label="Close">&#215;</button>
      </div>
      <div class="modal-body">
        <div id="limit-settings"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/app.js" defer></script>
</body>
</html>
