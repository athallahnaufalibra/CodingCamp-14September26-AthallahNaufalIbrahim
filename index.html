<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Notification bar (Requirements 5.4, 5.5, 5.6) -->
  <div id="notification-bar" role="alert" hidden>
    <span id="notification-msg"></span>
    <button id="notification-dismiss" type="button">×</button>
  </div>

  <!-- Summary / balance bar (Requirements 3.1, 7.1, 8.1) -->
  <header>
    <span id="balance-display">0.00</span>
    <button id="toggle-summary-btn" type="button">Monthly Summary</button>
    <button id="toggle-limits-btn" type="button">Spending Limits</button>
  </header>

  <main>

    <!-- Input form (Requirements 1.1, 1.2) -->
    <section id="form-section">
      <h2>Add Transaction</h2>
      <form id="txn-form" novalidate>
        <div class="field-group">
          <label for="item-name">Item Name</label>
          <input id="item-name" type="text" maxlength="100" required placeholder="e.g. Grocery run" />
          <span class="error" id="item-name-error"></span>
        </div>

        <div class="field-group">
          <label for="amount">Amount</label>
          <input id="amount" type="number" min="0.01" max="999999999.99" step="0.01" required placeholder="0.00" />
          <span class="error" id="amount-error"></span>
        </div>

        <div class="field-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
          <span class="error" id="category-error"></span>
        </div>

        <button id="add-btn" type="submit">Add</button>
      </form>

      <!-- Custom category UI (Requirement 6.1) -->
      <div id="custom-cat-section">
        <h3>Add Custom Category</h3>
        <input id="custom-cat-input" type="text" maxlength="50" placeholder="New category name" />
        <button id="add-cat-btn" type="button">Add Category</button>
        <span id="custom-cat-error"></span>
      </div>
    </section>

    <!-- Transaction list (Requirement 2.2) -->
    <section id="list-section">
      <h2>Transactions</h2>
      <div id="txn-list-wrapper">
        <ul id="txn-list">
          <li class="empty-state">No transactions recorded.</li>
        </ul>
      </div>
    </section>

    <!-- Spending chart (Requirement 4.1) -->
    <section id="chart-section">
      <h2>Spending by Category</h2>
      <div id="chart-wrapper">
        <canvas id="spending-chart"></canvas>
        <p id="chart-placeholder">No data to display yet. Add a transaction to see your spending chart.</p>
      </div>
    </section>

    <!-- Monthly summary panel (Requirement 7.1) -->
    <section id="monthly-summary" hidden>
      <h2>Monthly Summary</h2>
    </section>

    <!-- Spending limits panel (Requirement 8.1) -->
    <div id="limit-settings" hidden>
      <h2>Spending Limits</h2>
    </div>

  </main>

  <!-- Chart.js CDN (pinned 4.4.0) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Application logic -->
  <script src="js/app.js" defer></script>
</body>
</html>
